<!-- Firebase SDK (ESM via module script) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, deleteDoc, collection, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC8y4IYzcU_T3CQ4LfZsZH6a-kmVx7UlsI",
    authDomain: "transform-v1.firebaseapp.com",
    projectId: "transform-v1",
    storageBucket: "transform-v1.firebasestorage.app",
    messagingSenderId: "552977260205",
    appId: "1:552977260205:web:c43346ab972d2d72ed3024"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  window._db = db;
  window._fsDoc = doc;
  window._fsSetDoc = setDoc;
  window._fsGetDoc = getDoc;
  window._fsDeleteDoc = deleteDoc;
  window._fsCollection = collection;
  window._fsGetDocs = getDocs;
  window._fsWriteBatch = writeBatch;

  window._auth = auth;
  window._googleProvider = new GoogleAuthProvider();
  window._signInWithPopup = signInWithPopup;
  window._signOutFirebase = signOut;
  window._onAuthStateChanged = onAuthStateChanged;

  window._firebaseReady = true;
  window.dispatchEvent(new Event('firebaseReady'));
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

/* ===== LOGIN SCREEN ===== */
#loginScreen{
  position:fixed;inset:0;z-index:9999;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:0;
}
#loginScreen.hidden{display:none}
/* ===== SUBSCRIPTION (Pro) ===== */
.pro-chip{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;letter-spacing:1.2px;padding:2px 8px;border-radius:999px;border:1px solid var(--border);color:var(--t2);vertical-align:middle}
.pro-chip.pro{color:#04110a;background:linear-gradient(135deg,var(--g),#7dffc4);border-color:transparent;box-shadow:0 0 12px color-mix(in srgb,var(--g) 55%,transparent)}
.pro-chip.pend{color:var(--y);border-color:color-mix(in srgb,var(--y) 55%,transparent);background:color-mix(in srgb,var(--y) 10%,transparent)}
.pro-chip.rej{color:var(--red);border-color:color-mix(in srgb,var(--red) 55%,transparent)}
#subCard{margin:0 0 18px;padding:16px;border:1px solid var(--border);border-radius:14px;background:var(--card);position:relative;overflow:hidden}
#subCard.is-pro{border-color:color-mix(in srgb,var(--g) 60%,transparent);box-shadow:0 0 28px color-mix(in srgb,var(--g) 14%,transparent)}
#subCard .sub-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
#subCard .sub-title{font-size:15px;font-weight:700;color:var(--t)}
#subCard .sub-sub{font-size:13px;color:var(--t2);margin-top:6px;line-height:1.5}
#subCard .sub-btn{font:inherit;font-weight:700;font-size:13px;padding:9px 16px;border-radius:10px;border:1px solid var(--g);background:var(--g);color:#04110a;cursor:pointer;text-decoration:none;display:inline-block}
#subCard .sub-btn.ghost{background:transparent;color:var(--g)}
#entModal{position:fixed;inset:0;z-index:10070;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.62);padding:16px;backdrop-filter:blur(6px)}
#entModal.show{display:flex}
#entModal .box{width:100%;max-width:400px;text-align:center;background:var(--card);color:var(--t);border:1px solid var(--g);border-radius:20px;padding:28px 22px 22px;box-shadow:0 0 60px color-mix(in srgb,var(--g) 25%,transparent);animation:entPop .35s cubic-bezier(.2,1.2,.3,1) both}
#entModal.bad .box{border-color:var(--red);box-shadow:0 0 60px color-mix(in srgb,var(--red) 22%,transparent)}
#entModal .big{font-size:46px;line-height:1;margin-bottom:10px}
#entModal h3{font-size:19px;margin-bottom:8px}
#entModal p{font-size:14px;color:var(--t2);line-height:1.55}
#entModal button{margin-top:18px;font:inherit;font-weight:700;padding:10px 22px;border-radius:10px;border:none;background:var(--g);color:#04110a;cursor:pointer}
#entModal.bad button{background:var(--red);color:#fff}
@keyframes entPop{from{opacity:0;transform:scale(.88) translateY(12px)}to{opacity:1;transform:none}}
/* ===== PWA: update banner + iOS install hint ===== */
#pwaUpdateBar{position:fixed;left:50%;bottom:18px;transform:translate(-50%,24px);opacity:0;pointer-events:none;z-index:10050;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 24px);padding:10px 12px 10px 16px;background:var(--card,#151515);color:var(--t,#fff);border:1px solid var(--g,#00ff88);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.45);font-size:13.5px;transition:opacity .25s ease,transform .25s ease}
#pwaUpdateBar.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#pwaUpdateBar button{font:inherit;font-weight:700;cursor:pointer;border-radius:8px;padding:7px 12px;border:1px solid var(--g,#00ff88);background:var(--g,#00ff88);color:#04110a}
#pwaUpdateBar button.ghost{background:transparent;color:var(--t2,#999);border-color:transparent;font-weight:600}
#pwaIosHint{position:fixed;inset:0;z-index:10060;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);padding:16px}
#pwaIosHint.show{display:flex}
#pwaIosHint .box{width:100%;max-width:380px;background:var(--card,#151515);color:var(--t,#fff);border:1px solid var(--border,#2a2a2a);border-radius:16px;padding:18px 18px 14px;font-size:14px;line-height:1.55}
#pwaIosHint .box b{color:var(--g,#00ff88)}
#pwaIosHint .box button{margin-top:12px;width:100%;font:inherit;font-weight:700;cursor:pointer;border-radius:10px;padding:10px;border:1px solid var(--g,#00ff88);background:transparent;color:var(--g,#00ff88)}

/* ===== BOOT SPLASH (shown only while a saved login is being restored) ===== */
#bootSplash{position:fixed;inset:0;z-index:10001;display:none;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:var(--bg);transition:opacity .45s ease}
html.boot-restoring #bootSplash{display:flex}
#bootSplash.out{opacity:0;pointer-events:none}
#bootSplash > *{opacity:0;transition:opacity .35s ease}
#bootSplash.live > *{opacity:1}
#bootSplash::before{opacity:0}
#bootSplash.live::before{opacity:1}
#bootSplash::before{content:"";position:absolute;width:520px;height:520px;max-width:90vw;max-height:90vw;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--g) 16%,transparent) 0%,transparent 65%);animation:bootGlow 2.6s ease-in-out infinite}
.boot-ring{position:relative;width:86px;height:86px}
.boot-ring i{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:var(--g);animation:bootSpin 1.1s cubic-bezier(.5,.15,.5,.85) infinite}
.boot-ring i:nth-child(2){inset:10px;border-top-color:transparent;border-right-color:var(--p);animation-duration:1.6s;animation-direction:reverse}
.boot-ring i:nth-child(3){inset:21px;border-top-color:var(--g2);animation-duration:.9s}
.boot-ring b{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--g);box-shadow:0 0 14px var(--g);animation:bootPulse 1.4s ease-in-out infinite}
.boot-logo{position:relative;font-family:var(--mono,monospace);font-weight:800;font-size:28px;letter-spacing:6px;color:var(--t,#fff)}
.boot-logo span{color:var(--g)}
.boot-msg{position:relative;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--t2,#888)}
.boot-msg::after{content:"";display:inline-block;width:1.4em;text-align:left;animation:bootDots 1.4s steps(4,end) infinite}
.boot-bar{position:relative;width:160px;height:2px;background:color-mix(in srgb,var(--t2,#888) 25%,transparent);overflow:hidden;border-radius:2px}
.boot-bar::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,var(--g),transparent);animation:bootBar 1.3s ease-in-out infinite}
@keyframes bootSpin{to{transform:rotate(360deg)}}
@keyframes bootPulse{0%,100%{transform:scale(.7);opacity:.6}50%{transform:scale(1.25);opacity:1}}
@keyframes bootGlow{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}
@keyframes bootBar{0%{left:-45%}100%{left:105%}}
@keyframes bootDots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (prefers-reduced-motion:reduce){.boot-ring i,.boot-ring b,#bootSplash::before,.boot-bar::after,.boot-msg::after{animation:none}}
#onboardScreen{
  position:fixed;inset:0;z-index:9999;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:0;
}
#onboardScreen.hidden{display:none}
.hidden{display:none !important}
.ob-choice-card{
  background:var(--sb);border:1px solid var(--border);border-radius:10px;
  padding:16px 18px;margin-bottom:14px;cursor:pointer;transition:border-color .2s,transform .15s;
}
.ob-choice-card:hover{border-color:var(--g);transform:translateY(-2px);}
.ob-choice-title{font-family:'Smooch Sans','Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-weight:700;font-size:16px;color:var(--t);margin-bottom:6px;}
.ob-choice-desc{font-family:'Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:14.5px;color:var(--t2);line-height:1.5;}
.login-box{
  width:360px;background:var(--card);border:1px solid var(--border);
  border-top:2px solid var(--g);padding:36px 32px;
}
.login-logo{
  font-family:'Smooch Sans','Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:16px;font-weight:700;
  color:var(--g);letter-spacing:4px;text-align:center;margin-bottom:4px;
}
.login-sub{
  font-family:'Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:13px;color:var(--t2);
  letter-spacing:2px;text-align:center;margin-bottom:32px;
}
.login-label{
  font-family:'Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:12px;color:var(--t2);
  letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;
}
.login-inp{
  width:100%;background:var(--sb);border:1px solid var(--border);color:var(--t);
  font-family:'Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:15px;padding:10px 12px;
  outline:none;margin-bottom:14px;transition:border-color .2s;
}
.login-inp:focus{border-color:var(--g);}
.login-btn{
  width:100%;background:transparent;border:1px solid var(--g);color:var(--g);
  font-family:'Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:13.5px;letter-spacing:2px;
  padding:12px;cursor:pointer;transition:all .2s;text-transform:uppercase;

}
.login-btn:hover{background:color-mix(in srgb, var(--g) 7%, transparent);}
.login-err{
  color:#ff3355;font-family:'Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:13px;
  text-align:center;margin-top:10px;min-height:16px;letter-spacing:1px;
}
.login-sync{
  font-family:'Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:12px;color:color-mix(in srgb, var(--t2) 70%, transparent);
  text-align:center;margin-top:16px;letter-spacing:1px;
}
/* Firebase status dot */
.fb-status{
  width:6px;height:6px;border-radius:50%;background:var(--t3);
  display:inline-block;margin-right:5px;transition:background .3s;
}
.fb-status.connected{background:var(--g);}
.fb-status.saving{background:#ffaa44;animation:pulse 1s infinite;}

/* Alpha login overrides */
html.alpha #loginScreen{background:#f0f2f5;}
html.alpha .login-box{background:#fff;border:1px solid #dde1e7;border-top:3px solid var(--g);}
html.alpha .login-logo{color:var(--g);font-family:'Smooch Sans','Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-weight:900;}
html.alpha .login-sub{color:#5c677d;font-family:'Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-weight:600;}
html.alpha .login-label{color:#5c677d;font-family:'Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-weight:700;}
html.alpha .login-inp{background:#f8f9fc;border:1.5px solid #dde1e7;color:#1a1a2e;font-family:'Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;border-radius:8px;}
html.alpha .login-inp:focus{border-color:var(--g);}
html.alpha .login-btn{border-radius:8px;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border:none;font-family:'Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-weight:700;}
html.alpha .login-btn:hover{opacity:.9;}
html.alpha .login-err{font-family:'Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;}
html.alpha .login-sync{font-family:'Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#b0bec5;}

/* ===== PROFILE PAGE ===== */
.profile-section{background:var(--card);border:1px solid var(--border);padding:20px;margin-bottom:14px;}
.profile-avatar-big{
  width:64px;height:64px;background:var(--g3);border:2px solid var(--g);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--raj);font-size:16px;font-weight:700;color:var(--g);
  margin:0 auto 14px;
}
html.alpha .profile-avatar-big{border-radius:16px;background:linear-gradient(135deg,var(--g),var(--c));color:#fff;border:none;box-shadow:0 4px 16px color-mix(in srgb, var(--g) 30%, transparent);}
.danger-zone{background:var(--card);border:1px solid #3a1515;padding:14px;}
html.alpha .danger-zone{border-radius:12px;border-color:#f5c6c6;}

/* ===== DARK MODE (default) ===== */
:root{
  --bg:#0a0a0a;--sb:#0d0d0d;--panel:#0d0d0d;--card:#151515;--card2:#1a1a1a;
  --g:#00ff88;--g2:#00cc66;--g3:#003322;--gd:color-mix(in srgb, var(--g) 7%, transparent);
  --o:#ff6b00;--o2:#ffaa44;--c:#00e5ff;--c2:#00b8d4;
  --p:#aa77ff;--red:#ff3355;--y:#ffdd00;
  --t:#f2f2f2;--t2:#9a9a9a;--t3:#2a2a2a;
  --border:#232323;--mono:'Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;--raj:'Smooch Sans','Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  /* Habit-tracker status colors — fixed, never re-themed. A completed
     habit is always this green and a missed/incomplete one is always
     this red, in every theme, dark or light, whatever the accent. */
  --habit-done:#00c853;--habit-done-dim:#00963d;--habit-done-tint:rgba(0,200,83,.14);
  --habit-miss:#ff3b30;--habit-miss-dim:#d6281e;--habit-miss-tint:rgba(255,59,48,.14);
}

/* ===== LIGHT MODE ===== */
html.alpha{
  --bg:#f0f2f5;--sb:#ffffff;--panel:#ffffff;--card:#ffffff;--card2:#f8f9fc;
  --g:#00a651;--g2:#007a3d;--g3:#d4f5e2;--gd:color-mix(in srgb, var(--g) 8%, transparent);
  --o:#e85d04;--o2:#f48c06;--c:#0077b6;--c2:#0096c7;
  --p:#7209b7;--red:#d62828;--y:#e9c46a;
  --t:#1a1a2e;--t2:#5c677d;--t3:#e8ecf0;
  --border:#dde1e7;--mono:'Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;--raj:'Smooch Sans','Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
}

/* ===== ACCENT COLOR THEMES =====
   Pick one of 5 accent palettes; each has a dark-mode and light-mode variant.
   Applied via [data-accent] on <html>, combined with the .alpha (light) class.
   Only the accent (--g/--g2/--c/--c2) and its tinted surfaces (--g3/--gd)
   change per theme — buttons, active states, highlights, brand mark, and
   progress/water visuals follow the chosen color. Text (--t/--t2/--t3),
   backgrounds, cards and borders stay neutral black/white/grey in every
   theme so titles and descriptions never pick up the accent hue. Red stays
   reserved for negative values, green for positive, blue/sky-blue for
   water — those are set once in dark/light mode above and are not
   re-themed here. */

/* -- Azure (blue) -- */
html[data-accent="azure"]{
  --g:#22b8ff;--g2:#0d8fd6;--g3:#00233a;--gd:color-mix(in srgb, var(--g) 8%, transparent);--c:#7dd3fc;--c2:#38bdf8;
}
html.alpha[data-accent="azure"]{--g:#0284c7;--g2:#075985;--g3:#dbeefc;--gd:color-mix(in srgb, var(--g) 8%, transparent);--c:#0ea5e9;--c2:#0891b2;}

/* -- Violet (purple) -- */
html[data-accent="violet"]{
  --g:#b088ff;--g2:#8b5cf6;--g3:#241033;--gd:color-mix(in srgb, var(--g) 8%, transparent);--c:#e879f9;--c2:#c026d3;
}
html.alpha[data-accent="violet"]{--g:#7c3aed;--g2:#5b21b6;--g3:#ede4fb;--gd:color-mix(in srgb, var(--g) 8%, transparent);--c:#a855f7;--c2:#9333ea;}

/* -- Amber (orange) -- */
html[data-accent="amber"]{
  --g:#ffb020;--g2:#e08e00;--g3:#3a2600;--gd:color-mix(in srgb, var(--g) 8%, transparent);--c:#ff8a5c;--c2:#f4703f;
}
html.alpha[data-accent="amber"]{--g:#d97706;--g2:#b45309;--g3:#fdecd3;--gd:color-mix(in srgb, var(--g) 8%, transparent);--c:#ea580c;--c2:#c2410c;}

/* -- Rose (pink) -- */
html[data-accent="rose"]{
  --g:#ff5c8a;--g2:#e0356b;--g3:#3a0f1e;--gd:color-mix(in srgb, var(--g) 8%, transparent);--c:#ff8fab;--c2:#f43f5e;
}
html.alpha[data-accent="rose"]{--g:#e11d48;--g2:#9f1239;--g3:#fde2e9;--gd:color-mix(in srgb, var(--g) 8%, transparent);--c:#ec4899;--c2:#db2777;}


/* ===== PROFILE MENU (topbar) ===== */
.profile-menu{position:relative}
.profile-menu-btn{display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;padding:2px 4px 2px 2px;border-radius:12px;transition:background .15s}
.profile-menu-btn:hover{background:var(--gd)}
.avatar.avatar-sm{width:30px;height:30px;font-size:13.5px}
.profile-menu-caret{font-size:12px;color:var(--t2);transition:transform .18s;line-height:1}
.profile-menu.open .profile-menu-caret{transform:rotate(180deg)}
.profile-dropdown{
  position:absolute;top:calc(100% + 10px);right:0;min-width:220px;
  background:var(--glass-bg2,var(--panel));backdrop-filter:var(--glass-blur,none);-webkit-backdrop-filter:var(--glass-blur,none);
  border:1px solid var(--glass-border-hi,var(--border));border-radius:var(--radius-md,10px);
  box-shadow:var(--shadow-glow,0 12px 32px rgba(0,0,0,.35));
  padding:8px;display:none;z-index:200;
}
.profile-menu.open .profile-dropdown{display:block;animation:profileDdIn .15s ease both}
@keyframes profileDdIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.profile-dropdown-head{display:flex;align-items:center;gap:10px;padding:6px 8px 12px;border-bottom:1px solid var(--border);margin-bottom:6px}
.profile-dropdown-name{font-size:14.5px;font-weight:700;letter-spacing:.5px;color:var(--t);font-family:var(--raj)}
.profile-dropdown-sub{font-size:12px;color:var(--t2);letter-spacing:1px;margin-top:2px}
.profile-dropdown-item{display:flex;align-items:center;gap:9px;padding:9px 8px;font-size:14.5px;color:var(--t);cursor:pointer;border-radius:8px;transition:background .15s;letter-spacing:.3px}
.profile-dropdown-item:hover{background:var(--gd)}
.profile-dropdown-item.danger{color:var(--red)}
.profile-dropdown-item.danger:hover{background:rgba(214,40,40,.1)}
@media (max-width:400px){
  .profile-dropdown{min-width:190px}
}

/* ===== THEME TOGGLE ===== */
.theme-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;background:var(--card);border:1px solid var(--border);padding:5px 10px 5px 6px;transition:all .2s;user-select:none;}
.theme-toggle:hover{border-color:var(--g)}
/* Circular icon-only light/dark switch (topbar) — no track, no text label,
   just a single tappable glass circle showing the current mode's icon. */
.theme-toggle-circle{
  width:34px;height:34px;flex-shrink:0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--glass-bg);border:1px solid var(--glass-border);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  box-shadow:var(--shadow-soft);cursor:pointer;font-size:16.5px;line-height:1;
  transition:transform .15s ease,background .18s ease,box-shadow .18s ease;
}
.theme-toggle-circle:hover{background:var(--glass-bg2);transform:translateY(-1px)}
.theme-toggle-circle:active{transform:translateY(0) scale(.94)}
.theme-toggle-circle span{transition:transform .3s ease;display:inline-block}
.theme-toggle-circle:active span{transform:rotate(20deg)}

/* ===== Theme toggle hover popover — Dark/Light + accent swatches,
   surfaced on hover over the topbar sun/moon button (moved here from
   the profile dropdown so appearance controls live with the toggle). ===== */
.theme-toggle-wrap{position:relative}
.theme-popover{
  position:absolute;top:calc(100% + 10px);right:0;min-width:190px;
  background:var(--glass-bg2,var(--panel));backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border-hi,var(--border));border-radius:var(--radius-md,10px);
  box-shadow:var(--shadow-glow,0 12px 32px rgba(0,0,0,.35));
  padding:10px 8px 8px;
  opacity:0;visibility:hidden;transform:translateY(-6px);pointer-events:none;
  transition:opacity .16s ease,transform .16s ease,visibility .16s;
  z-index:210;
}
.theme-toggle-wrap:hover .theme-popover,
.theme-popover.pinned{
  opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto;
}
/* small gap-bridge so the popover doesn't close while moving the mouse
   from the button down into it */
.theme-toggle-wrap::after{
  content:'';position:absolute;top:100%;right:0;left:0;height:10px;
}

/* ===== Streak chip — animated flame badge, minimal text ===== */
.streak-fire-badge{
  width:20px;height:20px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:14.5px;line-height:1;
  background:radial-gradient(circle at 50% 38%, rgba(255,205,90,.95), rgba(255,90,0,.35) 68%, transparent 100%);
  animation:fireFlicker 1.1s ease-in-out infinite;
  transform-origin:50% 85%;
}
@keyframes fireFlicker{
  0%,100%{transform:scale(1) rotate(-3deg);filter:drop-shadow(0 0 3px rgba(255,140,0,.5));}
  25%{transform:scale(1.1) rotate(2deg);filter:drop-shadow(0 0 6px rgba(255,170,0,.75));}
  50%{transform:scale(.92) rotate(-2deg);filter:drop-shadow(0 0 4px rgba(255,110,0,.55));}
  75%{transform:scale(1.06) rotate(3deg);filter:drop-shadow(0 0 7px rgba(255,190,60,.8));}
}

/* ===== Date navigation — prev/next arrows + custom calendar popover ===== */
.date-nav{position:relative;display:flex;align-items:center;gap:4px}
.date-nav-arrow{
  width:26px;height:26px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--glass-bg,var(--card));border:1px solid var(--glass-border,var(--border));color:var(--t2);
  font-size:15.5px;line-height:1;cursor:pointer;transition:all .15s;
  backdrop-filter:var(--glass-blur,none);-webkit-backdrop-filter:var(--glass-blur,none);
}
.date-nav-arrow:hover{color:var(--g);border-color:color-mix(in srgb, var(--g) 40%, transparent);background:var(--glass-bg2,var(--card2))}
.date-nav-arrow:active{transform:scale(.92)}
button.date-disp{
  background:var(--glass-bg,var(--card));border:1px solid var(--glass-border,var(--border));
  border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap;
  font-family:inherit;transition:all .15s;
  backdrop-filter:var(--glass-blur,none);-webkit-backdrop-filter:var(--glass-blur,none);
}
button.date-disp:hover{color:var(--g);border-color:color-mix(in srgb, var(--g) 40%, transparent);background:var(--glass-bg2,var(--card2))}

.date-picker-pop{
  display:none;position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);
  width:270px;z-index:250;padding:12px;
  background:var(--glass-bg2,var(--panel));border:1px solid var(--glass-border-hi,var(--border));
  border-radius:var(--radius-md,14px);backdrop-filter:var(--glass-blur,none);-webkit-backdrop-filter:var(--glass-blur,none);
  box-shadow:var(--shadow-glow,0 12px 32px rgba(0,0,0,.35));
}
.date-picker-pop.open{display:block;animation:profileDdIn .15s ease both}
.dp-cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.dp-cal-nav{
  width:24px;height:24px;border-radius:50%;border:1px solid var(--glass-border,var(--border));
  background:transparent;color:var(--t2);cursor:pointer;font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.dp-cal-nav:hover{color:var(--g);border-color:color-mix(in srgb, var(--g) 40%, transparent)}
.dp-cal-title{font-size:14.5px;font-weight:700;letter-spacing:.3px;color:var(--t)}
.dp-cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px}
.dp-cal-weekdays span{font-size:12px;text-align:center;color:var(--t2);letter-spacing:.5px;opacity:.75}
.dp-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-cal-day{
  aspect-ratio:1;border:none;background:transparent;color:var(--t);font-size:13.5px;
  border-radius:50%;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;
}
.dp-cal-day:hover:not(:disabled){background:var(--glass-bg2,var(--card2))}
.dp-cal-day.other{color:var(--t2);opacity:.3;cursor:default}
.dp-cal-day.today{box-shadow:inset 0 0 0 1px var(--g);color:var(--g);font-weight:700}
.dp-cal-day.selected{background:linear-gradient(135deg,var(--g),var(--c)) !important;color:#04140e !important;font-weight:700}
.dp-cal-today-btn{
  width:100%;margin-top:10px;padding:8px;border-radius:999px;cursor:pointer;
  background:var(--glass-bg,var(--card));border:1px solid var(--glass-border,var(--border));
  color:var(--t2);font-size:13px;letter-spacing:1px;text-transform:uppercase;font-weight:600;
  transition:all .15s;
}
.dp-cal-today-btn:hover{color:var(--g);border-color:color-mix(in srgb, var(--g) 40%, transparent)}
@media (max-width:768px){
  .date-picker-pop{left:auto;right:0;transform:none}
}

/* ===== Quick Add — small glassy circular + button with popover menu ===== */
.quick-add-wrap{position:fixed;right:28px;bottom:28px;z-index:180;}
.quick-add-fab{
  width:50px;height:50px;border-radius:50%;flex-shrink:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  background:var(--glass-bg);border:1px solid var(--glass-border-hi);color:var(--g);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  box-shadow:var(--shadow-soft);transition:transform .18s ease,background .18s ease,box-shadow .18s ease;
}
.quick-add-fab-icon{font-size:25px;line-height:1;font-weight:500;transition:transform .25s ease;display:inline-block}
.quick-add-fab:hover{background:var(--glass-bg2);transform:translateY(-2px)}
.quick-add-fab:active{transform:translateY(0) scale(.94)}
.quick-add-wrap.open .quick-add-fab{color:var(--t2)}
.quick-add-wrap.open .quick-add-fab-icon{transform:rotate(45deg)}
.quick-add-pop{
  display:none;position:absolute;right:0;bottom:calc(100% + 12px);
  min-width:190px;padding:8px;z-index:181;
  background:var(--glass-bg2,var(--panel));border:1px solid var(--glass-border-hi,var(--border));
  border-radius:var(--radius-md,14px);backdrop-filter:var(--glass-blur,none);-webkit-backdrop-filter:var(--glass-blur,none);
  box-shadow:var(--shadow-glow,0 12px 32px rgba(0,0,0,.35));
}
.quick-add-wrap.open .quick-add-pop{display:block;animation:profileDdIn .15s ease both}
.quick-add-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;font-size:14.5px;color:var(--t);
  cursor:pointer;border-radius:8px;transition:background .15s;letter-spacing:.3px;
}
.quick-add-item:hover{background:var(--glass-bg,var(--gd))}
.quick-add-icon{font-size:16.5px;line-height:1;width:18px;text-align:center;flex-shrink:0}
html.alpha .quick-add-item{font-family:'Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
@media (max-width:900px){
  .quick-add-wrap{display:none;} /* mobile already has the bottom-nav Log+ FAB */
}
.toggle-track{width:36px;height:18px;background:var(--t3);border:1px solid var(--border);border-radius:9px;position:relative;transition:all .3s;flex-shrink:0;}
html.alpha .toggle-track{background:var(--g3);border-color:var(--g2)}
.toggle-knob{width:12px;height:12px;background:var(--t2);border-radius:50%;position:absolute;top:2px;left:2px;transition:all .3s;}
html.alpha .toggle-knob{left:20px;background:var(--g)}
.toggle-label{font-size:12px;letter-spacing:1.5px;color:var(--t2);font-family:var(--mono);text-transform:uppercase}

/* ===== APPEARANCE: mode buttons + accent swatches (in profile dropdown) ===== */
.pd-section-lbl{font-size:12px;letter-spacing:1.5px;color:var(--t2);font-family:var(--mono);text-transform:uppercase;padding:8px 8px 6px}
html.alpha .pd-section-lbl{font-family:'Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-weight:700;font-size:12px}
.pd-mode-row{display:flex;gap:6px;padding:0 8px 10px}
.pd-mode-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--card2);border:1px solid var(--border);color:var(--t2);font-family:var(--mono);font-size:13px;letter-spacing:1px;text-transform:uppercase;padding:8px 6px;cursor:pointer;border-radius:8px;transition:all .15s}
html.alpha .pd-mode-btn{font-family:'Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-weight:600;text-transform:none;font-size:13.5px}
.pd-mode-btn:hover{border-color:var(--g);color:var(--t)}
.pd-mode-btn.active{border-color:var(--g);color:var(--g);background:var(--gd)}
.pd-accent-row{display:flex;gap:10px;padding:0 10px 12px;border-bottom:1px solid var(--border);margin-bottom:6px}
.accent-swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;position:relative;transition:transform .15s,border-color .15s;flex-shrink:0}
.accent-swatch:hover{transform:scale(1.12)}
.accent-swatch.active{border-color:var(--t)}
.accent-swatch.active::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13.5px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.accent-swatch[data-swatch="emerald"]{background:linear-gradient(135deg,#00ff88,#00cc66)}
.accent-swatch[data-swatch="azure"]{background:linear-gradient(135deg,#22b8ff,#0d8fd6)}
.accent-swatch[data-swatch="violet"]{background:linear-gradient(135deg,#b088ff,#8b5cf6)}
.accent-swatch[data-swatch="amber"]{background:linear-gradient(135deg,#ffb020,#e08e00)}
.accent-swatch[data-swatch="rose"]{background:linear-gradient(135deg,#ff5c8a,#e0356b)}

.timer-tab.active{background:var(--gd);color:var(--g);border-bottom:2px solid var(--g)}
.timer-mode{display:none}
.timer-mode.active{display:block}
.timer-display-wrap{position:relative;width:280px;height:280px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;}
.timer-ring-svg{position:absolute;top:0;left:0;transform:rotate(-90deg)}
.timer-ring-bg{fill:none;stroke:var(--t3);stroke-width:10}

body{background:var(--bg);color:var(--t);font-family:var(--mono);height:100vh;overflow:hidden;display:flex;flex-direction:column;transition:background .3s,color .3s}

.os{display:flex;flex:1;overflow:hidden}
.topbar{background:transparent;border-bottom:none;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:fixed;top:0;left:0;right:0;z-index:950;height:54px;box-sizing:border-box;pointer-events:none}

.sb{background:transparent;border-right:none;display:flex;flex-direction:column;overflow:hidden;width:196px;flex-shrink:0;transition:width .32s cubic-bezier(.4,0,.2,1)}

.main{display:flex;flex-direction:column;overflow:hidden;flex:1;min-width:0;position:relative}

.page-title{font-family:var(--raj);font-size:16px;font-weight:700;letter-spacing:2px;color:var(--t);display:flex;align-items:center;gap:8px}
.page-title::before{content:'//';color:var(--g);font-family:var(--mono);font-size:13.5px}
.page-path{font-size:12px;color:var(--t2);letter-spacing:1px;margin-top:2px}
.content{flex:1;overflow-y:auto;padding:70px 20px 30px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
/* Custom pull-to-refresh indicator (mobile only — see markup comment
   for why the native browser gesture doesn't work in this layout). */
.ptr-indicator{
  position:absolute;top:0;left:50%;transform:translate(-50%,-56px);
  width:34px;height:34px;border-radius:50%;
  background:var(--glass-bg2,var(--card2));border:1px solid var(--glass-border,var(--border));
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-soft,0 4px 14px rgba(0,0,0,.25));
  z-index:80;pointer-events:none;
  transition:transform .18s ease;
}
.ptr-spinner{
  width:16px;height:16px;border-radius:50%;
  border:2px solid color-mix(in srgb, var(--g) 30%, transparent);
  border-top-color:var(--g);
  transform:rotate(0deg);
}
.ptr-indicator.ptr-spin .ptr-spinner{animation:ptrSpin .6s linear infinite}
@keyframes ptrSpin{to{transform:rotate(360deg)}}
.page{display:none}.page.active{display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
/* Nutrition page is now a single column: compact macro-ring row up top,
   then Log Water + Add Meal stacked full-width beneath it. */
.ntr-grid{display:flex;flex-direction:column;gap:16px;margin-bottom:14px}
.ntr-col-left,.ntr-col-right{min-width:0;width:100%}

/* ── Compact macro ring row: no individual card boxes — the six rings
   sit directly on one shared soft panel so they still read as a single
   grouped "today's totals" strip, laid out in one line (6-up) on
   desktop and wrapping down to fewer per row as the viewport narrows. ── */
.ntr-stat-panel{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:16px 10px 12px;
}
.ntr-stat-grid{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 4px}
.ntr-stat-grid .macro-card{
  flex:1 1 0;min-width:74px;max-width:120px;
  background:none;border:none;padding:0;box-shadow:none;
}

/* ── Macro ring cards (circular progress) ── */
.macro-card{align-items:center;text-align:center;gap:3px}
.macro-ring-wrap{position:relative;width:68px;height:68px;margin:2px auto 3px}
.macro-ring-svg{width:100%;height:100%;transform:rotate(-90deg);display:block;overflow:visible}
.macro-ring-bg{fill:none;stroke:var(--t3);stroke-width:6}
.macro-ring-fg{fill:none;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.macro-ring-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.macro-ring-val{font-family:var(--raj);font-size:16px;font-weight:700;line-height:1}
.macro-ring-unit{font-size:11px;color:var(--t2);letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.macro-goal{font-size:12px;color:var(--t2);letter-spacing:1px;text-transform:uppercase}
.macro-goal b{color:var(--t);font-weight:700;letter-spacing:0;text-transform:none;margin-left:3px}
.macro-rem{font-size:12px;margin-top:1px}
.macro-rem b{font-family:var(--raj);font-size:15.5px;font-weight:700;color:var(--t);margin-right:3px}
.macro-rem .lbl{font-size:11px;color:var(--t2);letter-spacing:.5px;text-transform:uppercase}
.macro-rem.is-done .lbl{color:var(--g2);font-weight:700}
.macro-rem.is-over b,.macro-rem.is-over .lbl{color:var(--red)}
@media (max-width:900px){
  .ntr-stat-grid .macro-card{min-width:30%;flex:1 1 30%}
}
@media (max-width:560px){
  .ntr-stat-grid .macro-card{min-width:45%;flex:1 1 45%}
  .macro-ring-wrap{width:58px !important;height:58px !important}
  .macro-ring-val{font-size:14.5px !important}
}

.wd{width:8px;height:8px;background:var(--t3);border:1px solid var(--border)}
.wd.done{background:var(--habit-done-dim);border-color:var(--habit-done-dim)}
.wd.skip{background:var(--habit-miss-tint);border-color:var(--habit-miss-dim)}
.water-visual{display:flex;gap:5px;flex-wrap:wrap;padding:14px;background:var(--card);border:1px solid var(--border)}
.water-visual.compact{padding:0;border:none;background:none;gap:4px}
.water-visual.compact .glass{width:16px;height:22px}
.glass{width:32px;height:40px;border:1px solid var(--border);background:var(--t3);position:relative;overflow:hidden;cursor:pointer;transition:border-color .2s}
.glass:hover{border-color:var(--c2)}
.glass-fill{position:absolute;bottom:0;left:0;right:0;background:var(--c2);transition:height .3s}
.glass.full .glass-fill{height:100%;background:var(--c)}
.glass.empty .glass-fill{height:0}
.vital-card{background:var(--card);border:1px solid var(--border);padding:14px}
.vital-big{font-family:var(--raj);font-size:16px;font-weight:700;letter-spacing:1px}
.vital-sub{font-size:12px;color:var(--t2);letter-spacing:2px;margin-top:4px}
.status-badge{display:inline-block;padding:3px 8px;font-size:12px;letter-spacing:1px;margin-top:8px;border:1px solid}
.s-ok{background:#001a0a;border-color:var(--g3);color:var(--g2)}
.s-warn{background:#1a0f00;border-color:#3a2500;color:var(--o2)}
.s-bad{background:#1a0008;border-color:#3a0015;color:var(--red)}
.meas-card{background:var(--card);border:1px solid var(--border);padding:12px;text-align:center}
.meas-val{font-family:var(--raj);font-size:16px;font-weight:700;color:var(--p)}
.meas-label{font-size:12px;color:var(--t2);letter-spacing:1px;margin-top:2px}
.meas-ch{font-size:13px;margin-top:4px}
.goal-card{background:var(--card);border:1px solid var(--border);padding:14px;margin-bottom:10px;position:relative}
.goal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.goal-name{font-family:var(--raj);font-size:15px;font-weight:600;letter-spacing:.5px}
.goal-pct{font-size:16px;color:var(--g);letter-spacing:1px}
.goal-bar{height:4px;background:var(--t3)}
.goal-fill{height:100%;background:var(--g);transition:width .6s}
.goal-dates{display:flex;justify-content:space-between;font-size:12px;color:var(--t2);margin-top:6px}
.chart-wrap{background:var(--card);border:1px solid var(--border);padding:14px;margin-bottom:10px}
.chart-label{font-size:11px;color:var(--t2);letter-spacing:2px;margin-bottom:10px}
canvas{display:block;width:100%}

/* ===== Weight trend: range toggle + current-weight badge + ruler chart ===== */
.wt-range-toggle{display:flex;gap:4px;background:var(--card2);border:1px solid var(--border);border-radius:20px;padding:3px}
.wt-range-btn{background:none;border:none;color:var(--t2);font-family:var(--mono);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;padding:6px 12px;border-radius:16px;cursor:pointer;transition:all .18s}
html.alpha .wt-range-btn{font-family:'Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-weight:600;text-transform:none;font-size:13.5px}
.wt-range-btn:hover{color:var(--t)}
.wt-range-btn.active{background:linear-gradient(135deg,var(--g),var(--c));color:#04140e;box-shadow:0 2px 8px color-mix(in srgb, var(--g) 35%, transparent)}
html.alpha .wt-range-btn.active{color:#fff}
.wt-chart-wrap{position:relative;overflow:hidden}
.wt-current-badge{
  position:absolute;top:14px;right:14px;z-index:2;text-align:right;
  background:var(--glass-bg2,var(--card2));backdrop-filter:var(--glass-blur,none);-webkit-backdrop-filter:var(--glass-blur,none);
  border:1px solid var(--glass-border-hi,var(--border));border-radius:10px;padding:6px 12px;
}
.wt-current-label{display:block;font-size:11px;letter-spacing:2px;color:var(--t2);font-family:var(--mono)}
html.alpha .wt-current-label{font-family:'Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-weight:700}
.wt-current-val{display:block;font-size:16px;font-weight:700;color:var(--g);font-family:var(--raj);letter-spacing:.5px}
.wt-hover-tip{
  position:fixed;display:none;z-index:50;transform:translate(-50%,-100%) translateY(-8px);
  background:var(--card2);border:1px solid var(--g);border-radius:6px;padding:5px 10px;
  font-family:var(--mono);font-size:13px;color:var(--t);white-space:nowrap;pointer-events:none;
  box-shadow:0 6px 18px rgba(0,0,0,.35);
}
html.alpha .wt-hover-tip{background:#fff;font-family:'Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.wt-hover-tip b{color:var(--g)}

/* ===== Weight trend v2: 1W / 1M / 1Y / Custom, stats strip, hover tooltip ===== */
.wt-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.wt-range-toggle{flex-wrap:nowrap;max-width:100%}
.wt-range-btn{font-size:12px;padding:6px 11px;letter-spacing:1px;white-space:nowrap}
.wt-custom{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;margin:0 0 10px;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:12px}
.wt-custom label{display:flex;flex-direction:column;gap:4px;font-size:10px;letter-spacing:2px;color:var(--t2);font-family:var(--mono)}
.wt-custom input[type=date]{font:inherit;font-size:13px;letter-spacing:0;color:var(--t);background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:7px 9px;color-scheme:dark light;min-width:140px}
.wt-custom input[type=date]:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px color-mix(in srgb, var(--g) 18%, transparent)}
.wt-quick{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.wt-quick button{font:inherit;font-size:11px;letter-spacing:1px;color:var(--t2);background:none;border:1px solid var(--border);border-radius:14px;padding:5px 10px;cursor:pointer}
.wt-quick button:hover{color:var(--g);border-color:var(--g)}
.wt-stats{display:grid;grid-template-columns:1.6fr repeat(4,1fr);gap:8px;margin-bottom:12px}
.wt-stat{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:8px 10px;min-width:0}
.wt-stat-l{display:block;font-size:10px;letter-spacing:1.6px;color:var(--t2);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt-stat-v{display:block;font-size:17px;font-weight:700;color:var(--t);font-family:var(--raj);letter-spacing:.4px;margin-top:2px}
.wt-stat-v small{font-size:11px;color:var(--t2);font-weight:600}
.wt-stat-main{background:linear-gradient(135deg,color-mix(in srgb, var(--p) 16%, var(--card2)),color-mix(in srgb, var(--g) 10%, var(--card2)));border-color:color-mix(in srgb, var(--p) 45%, var(--border));box-shadow:0 0 22px color-mix(in srgb, var(--p) 14%, transparent)}
.wt-stat-main .wt-stat-v{font-size:26px;color:var(--p);text-shadow:0 0 14px color-mix(in srgb, var(--p) 40%, transparent)}
#wtCurrentVal{color:var(--g)}
.wt-chart-wrap canvas{cursor:crosshair}
.wt-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--t2);letter-spacing:.4px}.wt-foot b{color:var(--g)}
.wt-hover-tip{display:none;text-align:center;line-height:1.35;padding:7px 12px;border-radius:10px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 8px 26px rgba(0,0,0,.4),0 0 16px color-mix(in srgb, var(--g) 25%, transparent)}
.wt-hover-tip .d{display:block;font-size:11px;color:var(--t2);letter-spacing:.4px}
.wt-hover-tip b{display:block;font-size:17px;font-family:var(--raj)}
.wt-hover-tip i{display:block;font-style:normal;font-size:11px}
@media (max-width:640px){
  .wt-stats{grid-template-columns:1fr 1fr}
  .wt-stat-main{grid-column:1 / -1}
  .wt-range-btn{padding:6px 9px;font-size:11.5px}
  .wt-quick{margin-left:0}
  .wt-custom input[type=date]{min-width:0;width:100%}
  .wt-custom label{flex:1 1 130px}
}
/* weight history list */
.wh-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.wh-sum>div{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:9px 11px}
.wh-sum span{display:block;font-size:10px;letter-spacing:1.6px;color:var(--t2);font-family:var(--mono)}
.wh-sum b{display:block;font-family:var(--raj);font-size:19px;margin-top:2px}
.wh-sum small,.wh-w small{font-size:11px;color:var(--t2);font-weight:600}
.wh-month{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 2px 6px;font-size:11px;letter-spacing:2px;color:var(--g);font-family:var(--mono)}
.wh-month em{font-style:normal;color:var(--t2);letter-spacing:1px}
.wh-row{display:grid;grid-template-columns:78px 86px 78px 1fr 32px;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-left:2px solid var(--g);border-radius:10px;padding:9px 12px;margin-bottom:6px;transition:border-color .2s,transform .2s,box-shadow .2s}
.wh-row:hover{border-color:var(--g);box-shadow:0 0 16px color-mix(in srgb, var(--g) 14%, transparent)}
.wh-date b{display:block;font-size:14px}.wh-date span{display:block;font-size:11px;color:var(--t2)}
.wh-w{font-family:var(--raj);font-size:20px;font-weight:700;color:var(--t)}
.wh-d{font-size:12.5px;font-weight:600}
.wh-ex{font-size:12px;color:var(--t2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wh-more{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#measHistory{display:block !important}
#measHistory > .wh-row{margin-bottom:6px !important}
#measHistory > .wh-month{margin:16px 2px 8px !important}
#measHistory > .wh-sum{margin-bottom:6px !important}

/* ===================== WORKOUT 2.0 ===================== */
.wk-tabs{display:flex;gap:6px;padding:4px;margin:0 0 14px;background:var(--card);border:1px solid var(--border);border-radius:14px;position:sticky;top:0;z-index:5}
.wk-tab{flex:1;font:inherit;font-size:13px;font-weight:700;letter-spacing:1.5px;color:var(--t2);background:none;border:none;border-radius:10px;padding:10px 6px;cursor:pointer;transition:all .2s;white-space:nowrap}
.wk-tab:hover{color:var(--t)}
.wk-tab.active{color:#04140e;background:linear-gradient(135deg,var(--g),var(--c));box-shadow:0 4px 18px color-mix(in srgb,var(--g) 35%,transparent)}
html.alpha .wk-tab.active{color:#fff}
.wk-btn{font:inherit;font-size:13px;font-weight:700;letter-spacing:1px;color:var(--t);background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:all .18s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.wk-btn:hover{border-color:var(--g);color:var(--g)}
.wk-btn.primary{color:#04140e;background:linear-gradient(135deg,var(--g),var(--c));border-color:transparent;box-shadow:0 4px 16px color-mix(in srgb,var(--g) 28%,transparent)}
html.alpha .wk-btn.primary{color:#fff}
.wk-btn.primary:hover{color:#04140e;filter:brightness(1.08);transform:translateY(-1px)}
html.alpha .wk-btn.primary:hover{color:#fff}
.wk-btn.sm{padding:7px 11px;font-size:12px;border-radius:9px}
.wk-btn.ok{background:var(--card2);color:var(--g);border:1px solid var(--g);box-shadow:none}
.wk-btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.wk-actions{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.wk-actions .wk-btn{flex:1 1 150px}
.wk-actions .wk-btn.primary{flex:2 1 200px}
.wk-stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.wk-stat{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--border);border-radius:14px;padding:12px 14px;position:relative;overflow:hidden}
.wk-stat::after{content:"";position:absolute;inset:auto -20% -60% auto;width:90px;height:90px;background:radial-gradient(circle,color-mix(in srgb,var(--g) 18%,transparent),transparent 70%)}
.wk-stat .l{font-size:10.5px;letter-spacing:1.8px;color:var(--t2);font-family:var(--mono)}
.wk-stat .v{font-family:var(--raj);font-size:24px;font-weight:700;color:var(--t);margin-top:2px}
.wk-stat .s{font-size:11.5px;color:var(--t2)}
.wk-prog{display:flex;align-items:center;gap:10px;margin:0 0 16px}
.wk-prog-t{flex:1;height:8px;border-radius:99px;background:var(--t3);overflow:hidden}
.wk-prog-f{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--g),var(--c));box-shadow:0 0 12px var(--g);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.wk-prog-p{font-family:var(--mono);font-size:12px;color:var(--g);min-width:38px;text-align:right}
/* type colours */
.t-strength{--tc:var(--g)}.t-bodyweight{--tc:var(--c)}.t-cardio{--tc:var(--o)}.t-interval{--tc:var(--y)}.t-timed{--tc:var(--p)}.t-flex{--tc:var(--g2)}
/* exercise cards */
#exList{display:block !important}
.wk-list,#exList{position:relative}
.wk-card{display:flex;gap:10px;align-items:stretch;background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 7%,var(--card)),var(--card));border:1px solid var(--border);border-left:3px solid var(--tc);border-radius:14px;padding:12px;margin-bottom:10px;position:relative;transition:box-shadow .2s,border-color .2s,opacity .2s;touch-action:pan-y}
.wk-card:hover{box-shadow:0 0 22px color-mix(in srgb,var(--tc) 14%,transparent);border-color:color-mix(in srgb,var(--tc) 40%,var(--border))}
.wk-card.done{background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 12%,var(--card)),var(--card))}
.wk-card.done .wk-name{color:var(--t2)}
.wk-card.dragging{z-index:30;box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 1px var(--tc);opacity:.96;transition:none;cursor:grabbing}
.is-dragging .wk-card:not(.dragging){transition:transform .18s ease}
.wk-handle{flex:none;width:26px;display:flex;align-items:center;justify-content:center;color:var(--t2);font-size:18px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;border-radius:8px}
.wk-handle:hover,.wk-handle:focus-visible{color:var(--tc);background:var(--t3);outline:none}
.wk-handle:active{cursor:grabbing}
.wk-num{flex:none;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,transparent);margin-top:1px}
.wk-body{flex:1;min-width:0}
.wk-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.wk-name{font-family:var(--raj);font-size:17px;font-weight:700;letter-spacing:.3px;word-break:break-word}
.wk-type{display:inline-flex;align-items:center;gap:4px;font-size:10px;letter-spacing:1.2px;font-weight:700;color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,transparent);border:1px solid color-mix(in srgb,var(--tc) 35%,transparent);border-radius:99px;padding:2px 8px;white-space:nowrap}
.wk-tags,.wk-tpl-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.wk-mus{font-size:11px;color:var(--t2);background:var(--t3);border-radius:99px;padding:2px 8px}
.wk-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.wk-pill{font-size:12px;color:var(--t2);background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:4px 9px;white-space:nowrap}
.wk-pill b{color:var(--t);font-weight:700}
.wk-sets{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.wk-sets-l{font-size:10px;letter-spacing:1.6px;color:var(--t2);font-family:var(--mono);margin-right:2px}
.wk-set{width:32px;height:32px;border-radius:10px;border:1.5px solid var(--border);background:var(--card2);color:var(--t2);font:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
.wk-set:hover{border-color:var(--tc);color:var(--tc)}
.wk-set.on{background:var(--tc);border-color:var(--tc);color:#04140e;box-shadow:0 0 12px color-mix(in srgb,var(--tc) 55%,transparent)}
html.alpha .wk-set.on{color:#fff}
.wk-more{font-size:12px;color:var(--t2)}
.wk-notes{margin-top:8px;font-size:12.5px;color:var(--t2)}
.wk-side{flex:none;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:8px}
.wk-check{width:34px;height:34px;border-radius:11px;border:2px solid var(--border);background:var(--card2);color:transparent;font-size:17px;font-weight:800;cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center}
.wk-check:hover{border-color:var(--tc)}
.wk-check.on{background:var(--tc);border-color:var(--tc);color:#04140e;box-shadow:0 0 16px color-mix(in srgb,var(--tc) 60%,transparent)}
html.alpha .wk-check.on{color:#fff}
.wk-act{display:flex;gap:2px}
.wk-ib{width:30px;height:30px;border-radius:8px;background:none;border:none;color:var(--t2);font-size:15px;cursor:pointer;transition:all .15s}
.wk-ib:hover{background:var(--t3);color:var(--g)}
.wk-ib.del:hover{color:var(--red)}
.wk-card.compact{padding:10px;margin-bottom:6px;border-radius:11px}
.wk-card.compact .wk-name{font-size:15px}
.wk-empty{text-align:center;padding:34px 16px;border:1px dashed var(--border);border-radius:16px;background:var(--card);margin-bottom:12px}
.wk-empty-ic{font-size:40px;filter:drop-shadow(0 0 14px var(--g))}
.wk-empty-t{font-family:var(--raj);font-size:19px;font-weight:700;margin-top:6px}
.wk-empty-s{font-size:13px;color:var(--t2);margin:6px auto 14px;max-width:420px}
.wk-empty-b{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.wk-none{font-size:13px;color:var(--t2);padding:12px 4px}
/* tooltip, snack, rest */
.wk-tip{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;font-size:12px;font-weight:700;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 50%,transparent);cursor:help;vertical-align:middle;margin-left:4px;font-family:var(--mono);line-height:1}
.wk-tip:hover,.wk-tip:focus{background:var(--c);color:#04140e;outline:none}
#wkTipBox{position:fixed;z-index:10050;max-width:280px;padding:10px 13px;border-radius:12px;background:color-mix(in srgb,var(--card2) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--c);color:var(--t);font-size:12.5px;line-height:1.5;box-shadow:0 12px 36px rgba(0,0,0,.5),0 0 18px color-mix(in srgb,var(--c) 22%,transparent);opacity:0;pointer-events:none;transform:translateY(4px);transition:opacity .14s,transform .14s}
#wkTipBox.show{opacity:1;transform:none}
#wkSnack{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);z-index:10040;display:flex;align-items:center;gap:14px;background:var(--card2);border:1px solid var(--border);color:var(--t);padding:10px 14px;border-radius:12px;font-size:13px;box-shadow:0 10px 32px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:all .25s;max-width:calc(100vw - 24px)}
#wkSnack.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#wkSnack button{font:inherit;font-weight:800;letter-spacing:1px;font-size:12px;color:var(--g);background:none;border:none;cursor:pointer}
#wkRest{position:fixed;left:50%;bottom:150px;transform:translate(-50%,20px);z-index:10030;width:min(340px,calc(100vw - 24px));background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--g);border-radius:16px;padding:12px 14px;box-shadow:0 14px 40px rgba(0,0,0,.5),0 0 24px color-mix(in srgb,var(--g) 25%,transparent);opacity:0;pointer-events:none;transition:all .25s}
#wkRest.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#wkRest .r-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
#wkRestName{font-size:10.5px;letter-spacing:1.6px;color:var(--t2);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wkRestTime{font-family:var(--raj);font-size:30px;font-weight:700;color:var(--g);text-shadow:0 0 14px color-mix(in srgb,var(--g) 50%,transparent)}
#wkRest .r-b{display:flex;gap:6px}
