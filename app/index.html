  import { getFirestore, doc, setDoc, getDoc, deleteDoc, collection, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC8y4IYzcU_T3CQ4LfZsZH6a-kmVx7UlsI",
    authDomain: "transform-v1.firebaseapp.com",
    projectId: "transform-v1",
    storageBucket: "transform-v1.firebasestorage.app",
    messagingSenderId: "552977260205",
    appId: "1:552977260205:web:c43346ab972d2d72ed3024"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  window._db = db;
  window._fsDoc = doc;
  window._fsSetDoc = setDoc;
  window._fsGetDoc = getDoc;
  window._fsDeleteDoc = deleteDoc;
  window._fsCollection = collection;
  window._fsGetDocs = getDocs;
  window._fsWriteBatch = writeBatch;

  window._auth = auth;
  window._googleProvider = new GoogleAuthProvider();
  window._signInWithPopup = signInWithPopup;
  window._signOutFirebase = signOut;
  window._onAuthStateChanged = onAuthStateChanged;

  window._firebaseReady = true;
  window.dispatchEvent(new Event('firebaseReady'));
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

/* ===== LOGIN SCREEN ===== */
#loginScreen{
  position:fixed;inset:0;z-index:9999;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:0;
}
#loginScreen.hidden{display:none}
/* ===== SUBSCRIPTION (Pro) ===== */
.pro-chip{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;letter-spacing:1.2px;padding:2px 8px;border-radius:999px;border:1px solid var(--border);color:var(--t2);vertical-align:middle}
.pro-chip.pro{color:#04110a;background:linear-gradient(135deg,var(--g),#7dffc4);border-color:transparent;box-shadow:0 0 12px color-mix(in srgb,var(--g) 55%,transparent)}
.pro-chip.pend{color:var(--y);border-color:color-mix(in srgb,var(--y) 55%,transparent);background:color-mix(in srgb,var(--y) 10%,transparent)}
.pro-chip.rej{color:var(--red);border-color:color-mix(in srgb,var(--red) 55%,transparent)}
#subCard{margin:0 0 18px;padding:16px;border:1px solid var(--border);border-radius:14px;background:var(--card);position:relative;overflow:hidden}
#subCard.is-pro{border-color:color-mix(in srgb,var(--g) 60%,transparent);box-shadow:0 0 28px color-mix(in srgb,var(--g) 14%,transparent)}
#subCard .sub-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
#subCard .sub-title{font-size:15px;font-weight:700;color:var(--t)}
#subCard .sub-sub{font-size:13px;color:var(--t2);margin-top:6px;line-height:1.5}
#subCard .sub-btn{font:inherit;font-weight:700;font-size:13px;padding:9px 16px;border-radius:10px;border:1px solid var(--g);background:var(--g);color:#04110a;cursor:pointer;text-decoration:none;display:inline-block}
#subCard .sub-btn.ghost{background:transparent;color:var(--g)}
#entModal{position:fixed;inset:0;z-index:10070;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.62);padding:16px;backdrop-filter:blur(6px)}
#entModal.show{display:flex}
#entModal .box{width:100%;max-width:400px;text-align:center;background:var(--card);color:var(--t);border:1px solid var(--g);border-radius:20px;padding:28px 22px 22px;box-shadow:0 0 60px color-mix(in srgb,var(--g) 25%,transparent);animation:entPop .35s cubic-bezier(.2,1.2,.3,1) both}
#entModal.bad .box{border-color:var(--red);box-shadow:0 0 60px color-mix(in srgb,var(--red) 22%,transparent)}
#entModal .big{font-size:46px;line-height:1;margin-bottom:10px}
#entModal h3{font-size:19px;margin-bottom:8px}
#entModal p{font-size:14px;color:var(--t2);line-height:1.55}
#entModal button{margin-top:18px;font:inherit;font-weight:700;padding:10px 22px;border-radius:10px;border:none;background:var(--g);color:#04110a;cursor:pointer}
#entModal.bad button{background:var(--red);color:#fff}
@keyframes entPop{from{opacity:0;transform:scale(.88) translateY(12px)}to{opacity:1;transform:none}}
/* ===== PWA: update banner + iOS install hint ===== */
#pwaUpdateBar{position:fixed;left:50%;bottom:18px;transform:translate(-50%,24px);opacity:0;pointer-events:none;z-index:10050;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 24px);padding:10px 12px 10px 16px;background:var(--card,#151515);color:var(--t,#fff);border:1px solid var(--g,#00ff88);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.45);font-size:13.5px;transition:opacity .25s ease,transform .25s ease}
#pwaUpdateBar.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#pwaUpdateBar button{font:inherit;font-weight:700;cursor:pointer;border-radius:8px;padding:7px 12px;border:1px solid var(--g,#00ff88);background:var(--g,#00ff88);color:#04110a}
#pwaUpdateBar button.ghost{background:transparent;color:var(--t2,#999);border-color:transparent;font-weight:600}
#pwaIosHint{position:fixed;inset:0;z-index:10060;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);padding:16px}
#pwaIosHint.show{display:flex}
#pwaIosHint .box{width:100%;max-width:380px;background:var(--card,#151515);color:var(--t,#fff);border:1px solid var(--border,#2a2a2a);border-radius:16px;padding:18px 18px 14px;font-size:14px;line-height:1.55}
#pwaIosHint .box b{color:var(--g,#00ff88)}
#pwaIosHint .box button{margin-top:12px;width:100%;font:inherit;font-weight:700;cursor:pointer;border-radius:10px;padding:10px;border:1px solid var(--g,#00ff88);background:transparent;color:var(--g,#00ff88)}

/* ===== BOOT SPLASH (shown only while a saved login is being restored) ===== */
#bootSplash{position:fixed;inset:0;z-index:10001;display:none;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:var(--bg);transition:opacity .45s ease}
html.boot-restoring #bootSplash{display:flex}
#bootSplash.out{opacity:0;pointer-events:none}
#bootSplash > *{opacity:0;transition:opacity .35s ease}
#bootSplash.live > *{opacity:1}
#bootSplash::before{opacity:0}
#bootSplash.live::before{opacity:1}
#bootSplash::before{content:"";position:absolute;width:520px;height:520px;max-width:90vw;max-height:90vw;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--g) 16%,transparent) 0%,transparent 65%);animation:bootGlow 2.6s ease-in-out infinite}
.boot-ring{position:relative;width:86px;height:86px}
.boot-ring i{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:var(--g);animation:bootSpin 1.1s cubic-bezier(.5,.15,.5,.85) infinite}
.boot-ring i:nth-child(2){inset:10px;border-top-color:transparent;border-right-color:var(--p);animation-duration:1.6s;animation-direction:reverse}
.boot-ring i:nth-child(3){inset:21px;border-top-color:var(--g2);animation-duration:.9s}
.boot-ring b{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--g);box-shadow:0 0 14px var(--g);animation:bootPulse 1.4s ease-in-out infinite}
.boot-logo{position:relative;font-family:var(--mono,monospace);font-weight:800;font-size:28px;letter-spacing:6px;color:var(--t,#fff)}
.boot-logo span{color:var(--g)}
.boot-msg{position:relative;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--t2,#888)}
.boot-msg::after{content:"";display:inline-block;width:1.4em;text-align:left;animation:bootDots 1.4s steps(4,end) infinite}
.boot-bar{position:relative;width:160px;height:2px;background:color-mix(in srgb,var(--t2,#888) 25%,transparent);overflow:hidden;border-radius:2px}
.boot-bar::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,var(--g),transparent);animation:bootBar 1.3s ease-in-out infinite}
@keyframes bootSpin{to{transform:rotate(360deg)}}
@keyframes bootPulse{0%,100%{transform:scale(.7);opacity:.6}50%{transform:scale(1.25);opacity:1}}
@keyframes bootGlow{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}
@keyframes bootBar{0%{left:-45%}100%{left:105%}}
@keyframes bootDots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (prefers-reduced-motion:reduce){.boot-ring i,.boot-ring b,#bootSplash::before,.boot-bar::after,.boot-msg::after{animation:none}}
#onboardScreen{
  position:fixed;inset:0;z-index:9999;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:0;
}
#onboardScreen.hidden{display:none}
.hidden{display:none !important}
.ob-choice-card{

.ob-choice-card:hover{border-color:var(--g);transform:translateY(-2px);}
.ob-choice-title{font-family:'Smooch Sans','Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-weight:700;font-size:16px;color:var(--t);margin-bottom:6px;}

.login-box{
  width:360px;background:var(--card);border:1px solid var(--border);

.login-logo{

.login-sync{

  text-align:center;margin-top:16px;letter-spacing:1px;
}
/* Firebase status dot */
.fb-status{
  width:6px;height:6px;border-radius:50%;background:var(--t3);
  display:inline-block;margin-right:5px;transition:background .3s;
}
.fb-status.connected{background:var(--g);}
.fb-status.saving{background:#ffaa44;animation:pulse 1s infinite;}

/* Alpha login overrides */
html.alpha #loginScreen{background:#f0f2f5;}
html.alpha .login-box{background:#fff;border:1px solid #dde1e7;border-top:3px solid var(--g);}

html.alpha .login-label{color:#5c677d;font-family:'Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-weight:700;}
html.alpha .login-inp{background:#f8f9fc;border:1.5px solid #dde1e7;color:#1a1a2e;font-family:'Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;border-radius:8px;}
html.alpha .login-inp:focus{border-color:var(--g);}
html.alpha .login-btn{border-radius:8px;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border:none;font-family:'Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-weight:700;}

html.alpha .login-err{font-family:'Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;}

/* ===== PROFILE PAGE ===== */
.profile-section{background:var(--card);border:1px solid var(--border);padding:20px;margin-bottom:14px;}
.profile-avatar-big{
  width:64px;height:64px;background:var(--g3);border:2px solid var(--g);

}

.danger-zone{background:var(--card);border:1px solid #3a1515;padding:14px;}

/* ===== DARK MODE (default) ===== */
:root{
  --bg:#0a0a0a;--sb:#0d0d0d;--panel:#0d0d0d;--card:#151515;--card2:#1a1a1a;
  --g:#00ff88;--g2:#00cc66;--g3:#003322;--gd:color-mix(in srgb, var(--g) 7%, transparent);
  --o:#ff6b00;--o2:#ffaa44;--c:#00e5ff;--c2:#00b8d4;
  --p:#aa77ff;--red:#ff3355;--y:#ffdd00;
  --t:#f2f2f2;--t2:#9a9a9a;--t3:#2a2a2a;
  --border:#232323;--mono:'Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;--raj:'Smooch Sans','Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  /* Habit-tracker status colors — fixed, never re-themed. A completed
     habit is always this green and a missed/incomplete one is always
     this red, in every theme, dark or light, whatever the accent. */
  --habit-done:#00c853;--habit-done-dim:#00963d;--habit-done-tint:rgba(0,200,83,.14);
  --habit-miss:#ff3b30;--habit-miss-dim:#d6281e;--habit-miss-tint:rgba(255,59,48,.14);
}

/* ===== LIGHT MODE ===== */
html.alpha{
  --bg:#f0f2f5;--sb:#ffffff;--panel:#ffffff;--card:#ffffff;--card2:#f8f9fc;
  --g:#00a651;--g2:#007a3d;--g3:#d4f5e2;--gd:color-mix(in srgb, var(--g) 8%, transparent);
  --o:#e85d04;--o2:#f48c06;--c:#0077b6;--c2:#0096c7;
  --p:#7209b7;--red:#d62828;--y:#e9c46a;
  --t:#1a1a2e;--t2:#5c677d;--t3:#e8ecf0;
  --border:#dde1e7;--mono:'Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;--raj:'Smooch Sans','Noto Sans Khmer','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
}

/* ===== ACCENT COLOR THEMES =====
   Pick one of 5 accent palettes; each has a dark-mode and light-mode variant.
   Applied via [data-accent] on <html>, combined with the .alpha (light) class.
   Only the accent (--g/--g2/--c/--c2) and its tinted surfaces (--g3/--gd)
   change per theme — buttons, active states, highlights, brand mark, and
   progress/water visuals follow the chosen color. Text (--t/--t2/--t3),
   backgrounds, cards and borders stay neutral black/white/grey in every
   theme so titles and descriptions never pick up the accent hue. Red stays
   reserved for negative values, green for positive, blue/sky-blue for
   water — those are set once in dark/light mode above and are not
   re-themed here. */

/* -- Azure (blue) -- */
html[data-accent="azure"]{
  --g:#22b8ff;--g2:#0d8fd6;--g3:#00233a;--gd:color-mix(in srgb, var(--g) 8%, transparent);--c:#7dd3fc;--c2:#38bdf8;
}
html.alpha[data-accent="azure"]{--g:#0284c7;--g2:#075985;--g3:#dbeefc;--gd:color-mix(in srgb, var(--g) 8%, transparent);--c:#0ea5e9;--c2:#0891b2;}

/* -- Violet (purple) -- */
html[data-accent="violet"]{
  --g:#b088ff;--g2:#8b5cf6;--g3:#241033;--gd:color-mix(in srgb, var(--g) 8%, transparent);--c:#e879f9;--c2:#c026d3;
}
html.alpha[data-accent="violet"]{--g:#7c3aed;--g2:#5b21b6;--g3:#ede4fb;--gd:color-mix(in srgb, var(--g) 8%, transparent);--c:#a855f7;--c2:#9333ea;}

/* -- Amber (orange) -- */
html[data-accent="amber"]{
  --g:#ffb020;--g2:#e08e00;--g3:#3a2600;--gd:color-mix(in srgb, var(--g) 8%, transparent);--c:#ff8a5c;--c2:#f4703f;
}
html.alpha[data-accent="amber"]{--g:#d97706;--g2:#b45309;--g3:#fdecd3;--gd:color-mix(in srgb, var(--g) 8%, transparent);--c:#ea580c;--c2:#c2410c;}

/* -- Rose (pink) -- */
html[data-accent="rose"]{
  --g:#ff5c8a;--g2:#e0356b;--g3:#3a0f1e;--gd:color-mix(in srgb, var(--g) 8%, transparent);--c:#ff8fab;--c2:#f43f5e;
}
html.alpha[data-accent="rose"]{--g:#e11d48;--g2:#9f1239;--g3:#fde2e9;--gd:color-mix(in srgb, var(--g) 8%, transparent);--c:#ec4899;--c2:#db2777;}


/* ===== PROFILE MENU (topbar) ===== */
.profile-menu{position:relative}
.profile-menu-btn{display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;padding:2px 4px 2px 2px;border-radius:12px;transition:background .15s}
.profile-menu-btn:hover{background:var(--gd)}
.avatar.avatar-sm{width:30px;height:30px;font-size:13.5px}
.profile-menu-caret{font-size:12px;color:var(--t2);transition:transform .18s;line-height:1}
.profile-menu.open .profile-menu-caret{transform:rotate(180deg)}
.profile-dropdown{
  position:absolute;top:calc(100% + 10px);right:0;min-width:220px;
  background:var(--glass-bg2,var(--panel));backdrop-filter:var(--glass-blur,none);-webkit-backdrop-filter:var(--glass-blur,none);
  border:1px solid var(--glass-border-hi,var(--border));border-radius:var(--radius-md,10px);
  box-shadow:var(--shadow-glow,0 12px 32px rgba(0,0,0,.35));
  padding:8px;display:none;z-index:200;
}
.profile-menu.open .profile-dropdown{display:block;animation:profileDdIn .15s ease both}
@keyframes profileDdIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.profile-dropdown-head{display:flex;align-items:center;gap:10px;padding:6px 8px 12px;border-bottom:1px solid var(--border);margin-bottom:6px}
.profile-dropdown-name{font-size:14.5px;font-weight:700;letter-spacing:.5px;color:var(--t);font-family:var(--raj)}
.profile-dropdown-sub{font-size:12px;color:var(--t2);letter-spacing:1px;margin-top:2px}
.profile-dropdown-item{display:flex;align-items:center;gap:9px;padding:9px 8px;font-size:14.5px;color:var(--t);cursor:pointer;border-radius:8px;transit
